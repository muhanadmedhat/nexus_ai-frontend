name: Deploy frontend

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: nexus-ai-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Next.js bakes NEXT_PUBLIC_* into the bundle at build time. nginx serves the
      # backend under the same origin, so a relative /api base is correct here.
      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Deploy to the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            exec 9>/tmp/nexus-ai-deploy.lock
            flock -x 9
            cd /opt/nexus-ai
            set -a; . .env; set +a
            aws ecr get-login-password --region us-east-1 |
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sed -i '/^FRONTEND_TAG=/d' .env
            echo "FRONTEND_TAG=$GITHUB_SHA" >> .env
            # Compose prefers an exported shell value over the updated .env file.
            # Refresh it here so this run cannot silently redeploy the old tag.
            export FRONTEND_TAG="$GITHUB_SHA"
            docker compose pull frontend
            docker compose up -d --no-deps frontend
            expected_image="$ECR_REGISTRY/nexus-ai-frontend:$GITHUB_SHA"
            actual_image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q frontend)")"
            test "$actual_image" = "$expected_image"
            # Concurrent repo deploys may have pulled a tagged image that is not
            # running yet. Only prune dangling layers here so one deploy cannot
            # delete another deploy's image between pull and up.
            docker image prune -f
            docker compose ps
